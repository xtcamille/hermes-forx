sha: d25580c94374b9985ce05b45ffa138e92d497cbb
description: A button in the Hermes Desktop composer that first repairs dictation
  typos in the draft, then rewrites it into a structured prompt; one more click restores
  the original typing. ⌘-click picks the model both steps use (written to auxiliary.prompt_*
  in config.yaml). Two gateway calls per click; reads the session's own history (local,
  read-only) to build a proper-noun list for the repair step, and adds the previous
  turn only on ⇧-click; keeps @file chips and /command + inline /skill references
  verbatim; per-session state. Ships a /enhance slash command (mobile app / Telegram
  / TUI) and a POST /enhance HTTP door (iOS Shortcuts) running the same two templates
  host-side.
