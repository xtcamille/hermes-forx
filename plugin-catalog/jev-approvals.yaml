name: jev-approvals
repo: https://github.com/anpicasso/hermes-jev-approvals
sha: fb5e5ba8052d74eb980420b8594981961f67cfeb
subdir: plugin
description: 'APPROVALS ONLY. Registers TypeSafe''s Jev decision model as a Hermes
  provider for the single purpose of serving `auxiliary.approval` when `approvals.mode:
  smart`. Jev returns typed probabilities instead of text, the native shape of the
  guardian''s APPROVE/DENY/ESCALATE question. An original 156-command baseline measured
  9.8x lower latency and 4.2x fewer human prompts than one configured aux chat model;
  this is baseline-specific, not a universal speedup, and the README links an independent
  v0.2.1 live-sandbox study. TypeSafe and OpenRouter are endpoint presets; any other
  Jev-compatible HTTPS decision endpoint can be selected with `base_url` plus an optional
  plugin-level `key_env`; without it, the request itself is anonymous. It registers
  no hooks and CANNOT generate text, so it refuses any prompt that is not the smart-approval
  guardian''s — never set it as a chat provider or for any other auxiliary task.'
maintainer: anpicasso
tier: community
category: models
