name: carbonvoice-platform
repo: https://github.com/PhononX/hermes-plugin-carbonvoice
sha: 903350415ef951e187dca42cb15e52e665352606
description: Carbon Voice gateway adapter for Hermes Agent. Connects via Socket.IO
  (primary) with REST polling fallback — no public webhook or tunnel required. Persists
  a cursor to disk so messages received while Hermes is offline are processed on the
  next startup. Replies via POST /v3/messages/start, so the Hermes agent appears as
  a bot user inside Carbon Voice. Text-only — Carbon Voice transcribes voice messages
  to text before delivering them.
