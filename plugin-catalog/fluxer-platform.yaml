name: fluxer-platform
repo: https://github.com/elkimek/hermes-fluxer-plugin
sha: f7765e0fd334432dc625adcc4b4435c943df77ed
description: Fluxer gateway adapter for Hermes Agent. Native Fluxer integration using
  Fluxer's bot REST API for outbound messages, Gateway WebSocket events for inbound
  dispatches, message edits, agent-requested reactions, pins, reply references, media
  delivery, and channel-directory enumeration. Reply references follow the shared
  off/first/all contract, replies can opt into a thread started from the triggering
  message, and CLI and /branch handoffs get their own thread. Auto-started threads
  are named from the triggering message and renamed to the session title once Hermes
  titles the session, matching the Discord adapter. Component buttons are deployment-dependent
  and approval prompts include visible slash-command fallback text; native slash commands
  are also deployment-dependent.
maintainer: elkimek
tier: community
category: platform
docs_url: https://github.com/elkimek/hermes-fluxer-plugin#readme
capabilities:
  provides_tools:
  - flux_recall
  - flux_search
  - flux_members
  - flux_audit
  provides_hooks:
  - pre_command
  provides_middleware: []
  requires_env:
  - name
version: 0.6.0
