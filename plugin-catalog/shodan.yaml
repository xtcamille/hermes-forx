name: shodan
repo: https://github.com/Adolanium/hermes-plugin-shodan
sha: d12828e9c90654bca598d45832cee2ef6454cf30
description: Shodan.io for Hermes. Host intel, search, DNS, CVE lookups, network monitoring
  and on-demand scanning, with a per-session credit budget and response shaping that
  keeps results inside the context window.
maintainer: Adolanium
tier: community
category: tools
docs_url: https://github.com/Adolanium/hermes-plugin-shodan#readme
capabilities:
  provides_tools:
  - shodan_host
  - shodan_search
  - shodan_count
  - shodan_dns
  - shodan_cve
  - shodan_account
  - shodan_meta
  - shodan_scan
  - shodan_alert
  - shodan_exploits
  - shodan_query
  - shodan_trends
  provides_hooks:
  - on_session_start
  - on_session_reset
  provides_middleware: []
  requires_env:
  - SHODAN_API_KEY
version: 0.1.1
