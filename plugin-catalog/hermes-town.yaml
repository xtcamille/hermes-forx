name: hermes-town
repo: https://github.com/sxuff/hermes-town
sha: 9c5e4b440dc1a16ca808ab27e23d9a078ae52e28
subdir: integrations/hermes-town-plugin
description: Passive Hermes Town bridge. Publishes bounded, pseudonymous agent lifecycle
  metadata to a same-host Town live server. Registers no tools, injects no context,
  and returns no control directive.
maintainer: sxuff
tier: community
category: tools
requires_hermes: '>=0.21'
docs_url: https://github.com/sxuff/hermes-town#readme
version: 0.3.0
image: https://raw.githubusercontent.com/sxuff/hermes-town/83aae757264b8cbae541830ba91834eed067c31a/artifacts/catalog-banner.png
capabilities:
  provides_tools: []
  provides_hooks:
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - subagent_start
  - subagent_stop
  provides_middleware: []
  requires_env: []
