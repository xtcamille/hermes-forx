name: rocketchat-platform
repo: https://github.com/HalfbitStudio/hermes-plugin-rocketchat
sha: 4cf9cab7c12c29837e6fe4ffcd8b29eb99ffcc93
description: Rocket.Chat gateway adapter for Hermes Agent. Connects to a self-hosted
  Rocket.Chat instance via the REST API v1 for outbound traffic and the Realtime (DDP)
  WebSocket for inbound messages. Uses aiohttp (already a Hermes dependency) — no
  extra packages needed.
maintainer: HalfbitStudio
tier: community
category: platform
docs_url: https://github.com/HalfbitStudio/hermes-plugin-rocketchat#readme
capabilities:
  provides_tools:
  - rocketchat_list_channels
  - rocketchat_create_channel
  - rocketchat_post
  - rocketchat_send_file
  - rocketchat_dm
  - rocketchat_delegate
  - rocketchat_search_messages
  - rocketchat_get_history
  - rocketchat_get_thread
  - rocketchat_get_permalink
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - name
version: 1.5.2
