name: hermes-jev
repo: https://github.com/keeltrace/hermes-jev
sha: 76320ec5d764d588d9042baac60702f333896b1a
description: Nerve supervisory nervous system for Hermes Agent with Jev, Laya, and
  OpenJev Reflex backends, evidence-backed Kanban supervision, token-budget trajectory
  control, context governance, and durable SSH Hermes workers.
maintainer: keeltrace
tier: community
category: automation
requires_hermes: '>=0.21'
docs_url: https://github.com/keeltrace/hermes-jev#readme
version: 0.4.15
capabilities:
  provides_tools:
  - nerve_decide
  - nerve_rank
  - nerve_verify
  - nerve_assess
  - nerve_context_curate
  - nerve_context_rehydrate
  - nerve_context_explain
  - nerve_stats
  - nerve_nervous_event
  - nerve_supervise_card
  - nerve_work_event
  - nerve_work_status
  - nerve_remote_delegate_task
  - nerve_remote_worker_status
  - nerve_remote_worker_result
  - nerve_remote_worker_cancel
  - nerve_remote_worker_control
  provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - transform_tool_result
  - pre_verify
  - post_api_request
  - api_request_error
  - post_llm_call
  - on_session_end
  provides_middleware: []
  requires_env: []
