name: custom-dangerous-patterns
repo: https://github.com/scross01/hermes-custom-dangerous-patterns-plugin
sha: 6b9bda685fb6271d2be7f13b75cd59fafc30f263
description: Add custom dangerous command patterns to Hermes's built-in approval system.
  Users define regex patterns in YAML; the plugin enforces them through Hermes's native
  pre_tool_call hook, so custom block patterns raise the standard Allow/Deny approval
  request on every surface (CLI, TUI, desktop, and chat channels) and deny patterns
  block immediately. The plugin modifies no Hermes internals.
maintainer: scross01
tier: community
category: tools
requires_hermes: '>=0.15'
version: 0.5.2
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env: []
