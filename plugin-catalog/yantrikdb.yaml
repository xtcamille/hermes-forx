description: YantrikDB — self-maintaining memory for Hermes with canonicalization,
  contradiction tracking, recency-aware ranking, explainable recall, and pluggable
  embedders (bundled potion-2M default; first-class loaders for the model2vec family
  and the HF sentence-transformers ecosystem; custom Python embedder class as escape
  hatch). As of v0.2.0 the default backend is in-process (`pip install` and go); HTTP-to-server
  is optional for HA cluster setups.
