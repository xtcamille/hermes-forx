name: toolaria
repo: https://github.com/Sahil-SS9/Toolaria
sha: f6cde55155dfd00833184f7e752bcb053e6d10d2
description: Rescue oversized MCP/web tool results before they flood context. Stores
  full result to disk via SHA256-addressed blob store. Returns excerpt + handle block.
  Provides rescuer_fetch tool (range/grep/search/outline/stat/full) and pass-by-reference
  (tla:<id>) for downstream tools.
maintainer: Sahil-SS9
tier: community
category: tools
requires_hermes: '>=0.21'
docs_url: https://github.com/Sahil-SS9/Toolaria
platforms: []
capabilities:
  provides_tools:
  - rescuer_fetch
  provides_hooks:
  - transform_tool_result
  - on_session_start
  - on_session_end
  provides_middleware:
  - tool_request
  requires_env: []
version: 3.1.2
