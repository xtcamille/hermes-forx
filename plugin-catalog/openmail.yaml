name: openmail
repo: https://github.com/openmailsh/hermes-plugin
sha: b72f61d6e6b0faab091b781ffc1e541f60a0a1a4
description: Gives a Hermes agent its own email address. Inbound mail wakes the agent
  over a websocket; replies go out in-thread. Ships native tools for sending, reading
  mail, saving and editing HTML drafts in a sending inbox, sending reviewed drafts,
  deleting discarded drafts, and provisioning, plus the OpenMail skill.
maintainer: openmailsh
tier: community
category: platform
docs_url: https://docs.openmail.sh/integrations/hermes
image: https://raw.githubusercontent.com/openmailsh/.github/f9d07f18a90a75e8b29f96cbc8d17154ce254828/profile/assets/banner.png
platforms: []
capabilities:
  provides_tools:
  - openmail_whoami
  - openmail_send
  - openmail_create_draft
  - openmail_list_drafts
  - openmail_get_draft
  - openmail_edit_draft
  - openmail_send_draft
  - openmail_delete_draft
  - openmail_reply
  - openmail_list_threads
  - openmail_read_thread
  - openmail_list_messages
  - openmail_list_folders
  - openmail_list_folder_messages
  - openmail_attachment_text
  - openmail_list_inboxes
  - openmail_create_inbox
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - OPENMAIL_API_KEY
version: 0.3.4
