description: Unified multi-provider quota usage tracking in the status bar, with read-only
  OAuth access checks and user-managed provider pools. Public edition does not read
  vendor CLI auth files, refresh vendor tokens, write Hermes config automatically,
  or copy secrets into a plugin-owned library.env. Publishes the current session's
  tokens/sec, context occupancy, and that provider's remaining quota as the Discord
  bot presence.
