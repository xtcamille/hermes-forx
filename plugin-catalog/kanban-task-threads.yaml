name: kanban-task-threads
repo: https://github.com/diegomarino/kanban-task-threads
sha: 467284665eb18360e9c32cd8fe4ff76690a66231
description: 'Every kanban task gets a forum thread of its own: the first post is
  a live status card rewritten in place, the replies are the append-only log. Discord
  is the first transport.'
maintainer: diegomarino
tier: community
category: automation
requires_hermes: '>=0.20'
docs_url: https://github.com/diegomarino/kanban-task-threads#readme
version: 0.4.1
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
  - kanban_task_claimed
  - kanban_task_completed
  - kanban_task_blocked
  - on_kanban_task_updated
  - on_kanban_worker_spawned
  - on_kanban_worker_exited
  - on_kanban_worker_stale_claim
  - on_kanban_dispatch_tick
  provides_middleware: []
  requires_env:
  - KANBAN_TASK_THREADS_WEBHOOK_URL
