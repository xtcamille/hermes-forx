name: fmsg-platform
repo: https://github.com/markmnl/hermes-fmsg
sha: b3691831d03d88c29f86ac67a4b99cfd04cb4107
description: fmsg platform adapter for Hermes Agent. Real-time inbound over the fmsg-webapi
  WebSocket (/fmsg/ws), outbound via its JSON REST routes. Authenticates with an fmsg
  API key (fmsgk_...) exchanged for a short-lived JWT — run the agent as a derived
  sub-account such as @alice_hermes@example.com. Only httpx + websockets, no SDK.
maintainer: markmnl
