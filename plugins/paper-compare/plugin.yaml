name: paper-compare
label: 论文工作台
version: 1.3.0
manifest_version: 2
api_version: 1
kind: standalone
description: "Local paper library, isolated multi-model conversations, visual close reading, and evidence verification. Includes Desktop and Dashboard pages."
author: ForX
homepage: https://github.com/xtcamille/hermes-forx/tree/main/plugins/paper-compare
license: MIT
tags: [research, papers, desktop, evidence]
config_schema:
  data_dir:
    type: str
    description: "Existing Paper Compare data directory, or empty for profile-local storage."
  env_file:
    type: str
    description: "Legacy private parser configuration only (MinerU/Poppler). LLM credentials always come from ForX."
  node_path:
    type: str
    description: "Profile-relative or absolute Node.js executable (22.13+). The installer keeps an independent runtime in this profile."
  browser_storage_scope:
    type: str
    description: "Preserved browser preference namespace when moving the same library into this profile."
  port:
    type: int
    description: "Optional stable loopback port; initially allocated automatically, then remembered per profile."
  pdf_parser:
    type: str
    description: "mineru or poppler."
  mineru_base_url:
    type: str
    description: "MinerU v1 HTTP endpoint."
  mineru_tier:
    type: str
    description: "MinerU parsing tier: flash, basic, standard or advanced."
  vision_report:
    type: str
    description: "Optional existing visual capability report; migration retains it in the profile library."
