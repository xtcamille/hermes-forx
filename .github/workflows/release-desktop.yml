name: Release Desktop (Win & Mac)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0 or v0.1.0). Leave empty to use apps/desktop/package.json version.'
        required: false
        type: string
        default: ''
      publish_release:
        description: 'Create/update GitHub Release with built installers'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-x64
            runner: windows-latest
            build_cmd: npm run dist:win:nsis
            artifact_glob: |
              apps/desktop/release/*.exe
          - name: macOS (Apple Silicon arm64)
            os: macos-arm64
            runner: macos-latest
            build_cmd: npm run dist:mac
            artifact_glob: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        shell: bash
        run: npm i -g npm@12

      - name: Install Node workspace dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Sync version into apps/desktop/package.json
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          RAW_VER=""
          if [ -n "$INPUT_VERSION" ]; then
            RAW_VER="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            RAW_VER="$REF_NAME"
          fi
          CLEAN_VER="${RAW_VER#v}"
          if [ -n "$CLEAN_VER" ]; then
            echo "Syncing apps/desktop/package.json version to: $CLEAN_VER"
            node -e '
              const fs = require("fs");
              const p = "apps/desktop/package.json";
              const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
              pkg.version = process.argv[1];
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
              const initPath = "hermes_cli/__init__.py";
              if (fs.existsSync(initPath)) {
                const initSrc = fs.readFileSync(initPath, "utf8");
                fs.writeFileSync(initPath, initSrc.replace(/__version__\s*=\s*["'][^"']+["']/, `__version__ = "${process.argv[1]}"`));
              }
            ' "$CLEAN_VER"
          else
            echo "Using existing version from apps/desktop/package.json"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install standalone Python 3.11
        env:
          UV_PYTHON_PREFERENCE: only-managed
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Sync Python dependencies into .venv
        env:
          UV_PYTHON_PREFERENCE: only-managed
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all

      - name: Assemble embedded Python backend
        shell: bash
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: uv run --no-sync python scripts/bundle_embedded_backend.py

      - name: Build and package Electron Desktop installer
        working-directory: apps/desktop
        shell: bash
        env:
          RAW_CSC_LINK: ${{ secrets.CSC_LINK }}
          RAW_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -n "${RAW_CSC_LINK:-}" ]; then
            export CSC_LINK="$RAW_CSC_LINK"
            export CSC_KEY_PASSWORD="${RAW_CSC_KEY_PASSWORD:-}"
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          ${{ matrix.build_cmd }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 14
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-desktop
    if: github.ref_type == 'tag' || inputs.publish_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all built installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          cd release-assets
          ls -la
          sha256sum ForX-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            TAG="v${INPUT_VERSION#v}"
          else
            PKG_VER=$(node -p 'require("../apps/desktop/package.json").version')
            TAG="v${PKG_VER#v}"
          fi

          echo "Publishing to GitHub Release tag: $TAG"
          VER_NUM="${TAG#v}"
          cat << EOF > release_notes.md
### 📦 安装包下载 / Downloads
- **Windows (x64)**: \`ForX-${VER_NUM}-win-x64.exe\`
- **macOS (Apple Silicon M1/M2/M3/M4)**: \`ForX-${VER_NUM}-mac-arm64.dmg\` / \`ForX-${VER_NUM}-mac-arm64.zip\`

---

### 💡 安装与运行说明 / Installation Guide

#### 🪟 Windows 用户：
下载 \`ForX-${VER_NUM}-win-x64.exe\`，直接双击安装运行即可。已内嵌独立的 Python 3.11 及后端运行环境，无需自行安装配置 Python。

#### 🍎 macOS 用户（重要）：
下载 \`ForX-${VER_NUM}-mac-arm64.dmg\`，将 \`ForX.app\` 拖入 **应用程序** (Applications) 目录。

> ⚠️ **首次打开提示“文件已损坏，您应该将它移到废纸篓”或“无法打开”？**
> 这是因为本开源应用未配置苹果商业付费开发者证书（\$99/年），被 macOS Gatekeeper 安全机制拦截，**并非安装包损坏**。
>
> **快速解决步骤（二选一）：**
> 1. **终端命令（推荐，最快）：** 打开 Mac 自带的「终端」(Terminal.app)，运行以下命令移除系统隔离标记：
>    \`\`\`bash
>    sudo xattr -cr /Applications/ForX.app
>    \`\`\`
>    输入开机密码回车后，再次双击 \`ForX\` 即可正常秒开！
> 2. **系统设置：** 双击打开提示已损坏后点击取消，打开 **「系统设置」->「隐私与安全性」**，滑到最底部安全性处，点击 **「仍要打开」** 并输入密码。

---
EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ForX-* SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" ForX-* SHA256SUMS.txt \
              --title "ForX Desktop $TAG" \
              --notes-file release_notes.md
          fi
